<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orchestrator monitor</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1d2130; --text: #e6e8ee;
    --muted: #8b90a0; --line: #2a2f40;
    --queued: #8b90a0; --running: #e8b23c; --done: #4cc38a; --failed: #e5534b; --info: #6ea8fe;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f1f5; --text:#1c1e26; --muted:#6a6f80; --line:#e2e4ea; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  body.task header h1, body.stats header h1 { cursor:pointer; }
  body.task header h1:hover, body.stats header h1:hover { text-decoration:underline; text-underline-offset:3px; }
  /* lives in the timeplan card's title row, after the right-aligned range */
  #statsLink { color:var(--info); font-size:12px; font-weight:500; text-transform:none; letter-spacing:0; text-decoration:none; white-space:nowrap; }
  #statsLink:hover, #statsLink:focus-visible { text-decoration:underline; text-underline-offset:3px; }
  #crumb { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:40vw; }
  #taskSel, #rateSel, #zoomSel { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:3px 8px; font:12px/1.4 inherit; max-width:280px; }
  #rate, #zoom { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; }
  /* Task-view zoom: CSS zoom (not transform) reflows real layout, so every
     part — header, cards, dials, log — grows in the same proportion and the
     grid re-wraps to fit. 100% is the untouched default; home never zooms. */
  body.task, body.stats { zoom: var(--zoom, 1); }
  #conn { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; }
  #conn .dot { width:8px; height:8px; border-radius:50%; background:var(--failed); }
  #conn.on .dot { background: var(--done); }
  #overall { margin-left:auto; color:var(--muted); font-size:12px; }
  body.home #taskSel, body.home #conn, body.home #rate, body.home #zoom, body.home #overall { display:none; }
  /* auto-fill (not auto-fit): with few plans on a wide screen, empty tracks
     keep each card at a readable ~380-520px instead of stretching it edge to edge */
  main#cards { padding: 20px 24px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(min(380px, 100%), 1fr)); max-width:1600px; margin:0 auto; align-items:start; }
  body.home main#cards { display:none; }
  main#home { padding: 24px; display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(min(280px, 100%), 1fr)); max-width:1200px; margin:0 auto; }
  body.task main#home, body.stats main#home { display:none; }
  body.stats main#cards { display:none; }
  /* Statistics view: large-figure stat tiles over the same accumulators the
     cards build — one hero figure, then a KPI grid. Values wear ink tokens;
     the only color is a status dot beside the plans-green/red labels. */
  main#statsView { display:none; padding:20px 24px; gap:14px; grid-template-columns:repeat(auto-fill, minmax(min(210px, 100%), 1fr)); max-width:1600px; margin:0 auto; }
  body.stats main#statsView { display:grid; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .stat .sl { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; gap:7px; }
  .stat .sl .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .stat .sl .dot.done { background:var(--done); }
  .stat .sl .dot.failed { background:var(--failed); }
  .stat .sl .dot.running { background:var(--running); animation:chipblink 1.1s ease-in-out infinite; }
  .stat .sl .dot.queued { background:var(--queued); }
  .stat .sv { font-size:34px; font-weight:650; line-height:1.15; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stat .ss { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stat.hero { grid-column:1 / -1; }
  .stat.hero .sv { font-size:56px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; cursor:pointer; display:flex; flex-direction:column; gap:8px; transition:border-color .15s, transform .15s; }
  .tile:hover, .tile:focus-visible { border-color:var(--info); transform:translateY(-2px); }
  .tile:focus-visible { outline:2px solid var(--info); outline-offset:2px; }
  .tile h3 { margin:0; font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; overflow-wrap:anywhere; flex-wrap:wrap; }
  .tile .meta { color:var(--muted); font-size:12px; }
  .tile .lastline { color:var(--muted); font-size:12px; font-family:ui-monospace, monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size:13px; font-weight:600; margin:0; padding:12px 14px; display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; border-bottom:1px solid var(--line); min-width:0; }
  .card h2 .title { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Orchestrator log disclosure: the header always stays visible; only the log
     list folds. Collapsed by default, arrow rotates when open. */
  .card h2 .foldbtn { background:none; border:none; color:var(--muted); font-size:10px; line-height:1; cursor:pointer; padding:2px 4px; flex:none; transition:transform .15s; }
  .card h2 .foldbtn:hover, .card h2 .foldbtn:focus-visible { color:var(--text); }
  .card:not(.logfold) h2 .foldbtn { transform:rotate(90deg); }
  .card.logfold .log { display:none; }
  .badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.04em; color:#0f1117; background:var(--queued); }
  .badge.running { background:var(--running); animation:runpulse 1.1s ease-in-out infinite; }
  .badge.running::before { content:""; width:7px; height:7px; border-radius:50%; border:2px solid #0f1117; border-top-color:transparent; animation:spin .7s linear infinite; }
  .badge.done { background:var(--done); }
  .badge.failed { background:var(--failed); }
  .badge.info { background:var(--info); }
  .tok { margin-left:auto; color:var(--muted); font-weight:500; font-size:11px; font-variant-numeric:tabular-nums; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .span { color:var(--muted); font-weight:500; font-size:11px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  /* No .tok.bump class and no @keyframes tokbump: restarting a CSS animation
     needs a forced synchronous layout read (an offsetWidth query discarded for
     its side effect) on a per-event path, which measured 137 s of layout on one
     replay. The counter pulse is a WAAPI el.animate() instead — it restarts
     natively and never reads layout (FRONTEND-RENDER-2). Reduced motion is
     honoured in JS, since the media query below only reaches CSS animations.
     The reflow idiom is BANNED file-wide and test_frontend.py asserts its
     absence, so this comment names it without spelling it. */
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes runpulse {
    0%, 100% { box-shadow:0 0 0 0 rgba(232,178,60,.6); transform:scale(1); }
    50%      { box-shadow:0 0 0 8px rgba(232,178,60,0); transform:scale(1.07); }
  }
  .flow { display:flex; gap:4px; align-items:center; padding:10px 14px; flex-wrap:wrap; border-bottom:1px solid var(--line); font-size:11px; }
  .flow:empty { display:none; }
  .flow .node { padding:2px 9px; border-radius:99px; border:1px solid var(--line); color:var(--muted); font-weight:600; }
  .flow .node.running { border-color:var(--running); color:var(--running); animation:chipblink 1.1s ease-in-out infinite; }
  .flow .node.done { border-color:var(--done); color:var(--done); }
  .flow .node.failed { border-color:var(--failed); color:var(--failed); }
  .flow .arrow { color:var(--muted); }
  .flow .loopback { color:var(--running); font-weight:600; margin-left:4px; }
  .agents { list-style:none; margin:0; padding:6px 0; border-bottom:1px solid var(--line); font-size:12px; }
  .agents:empty { display:none; }
  /* flex-wrap: the token counter is long and nowrap — when the row is tight it
     must wrap to its own line, never squeeze the agent name out of view */
  .agents li { display:flex; flex-wrap:wrap; gap:2px 10px; align-items:center; padding:2px 14px; font-family:ui-monospace, monospace; min-width:0; }
  .agents .dot { width:8px; height:8px; border-radius:50%; background:var(--queued); flex:none; }
  .agents li.running .dot { background:var(--running); animation:chipblink 1.1s ease-in-out infinite; }
  .agents li.done .dot { background:var(--done); }
  .agents li.failed .dot { background:var(--failed); }
  .agents li.stale { opacity:.55; }
  .log li.stale .s { color:var(--muted); }
  .agents .alabel { font-weight:600; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .agents .atok { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .agents .adur { color:var(--muted); min-width:52px; text-align:right; font-variant-numeric:tabular-nums; }
  /* Orchestrator accordion content: a bullet list of every sub-plan loop
     (state dot as the bullet, click jumps to that loop's card), revealed
     together with the log by the fold arrow. Only the orchestrator card ever
     owns a .subplans, so the .logfold gate below cannot hide anything else. */
  .subplans { list-style:none; margin:0; padding:8px 0; border-bottom:1px solid var(--line); font-size:12px; }
  .subplans:empty { display:none; }
  .card.logfold .subplans { display:none; }
  .subplans li { display:flex; align-items:center; gap:8px; padding:2px 14px; font-family:ui-monospace, monospace; min-width:0; cursor:pointer; }
  .subplans li:hover, .subplans li:focus-visible { background:var(--panel2); }
  .subplans .dot { width:8px; height:8px; border-radius:50%; background:var(--queued); flex:none; }
  .subplans li.running .dot { background:var(--running); animation:chipblink 1.1s ease-in-out infinite; }
  .subplans li.done .dot { background:var(--done); }
  .subplans li.failed .dot { background:var(--failed); }
  /* Roster entries whose loop has no card yet: display-only, hollow dot. */
  .subplans li.planned { cursor:default; }
  .subplans li.planned:hover, .subplans li.planned:focus-visible { background:transparent; }
  .subplans li.planned .dot { background:transparent; border:1.5px solid var(--muted); box-sizing:border-box; }
  .subplans .spname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .subplans .spstate { margin-left:auto; color:var(--muted); flex:none; }
  .stagebar { display:flex; gap:6px; padding:10px 14px; flex-wrap:wrap; border-bottom:1px solid var(--line); background:var(--panel2); }
  .chip { font-size:11px; padding:2px 8px; border-radius:6px; border:1px solid var(--line); color:var(--muted); }
  .chip.running { border-color:var(--running); color:var(--running); animation:chipblink 1.1s ease-in-out infinite; }
  @keyframes chipblink { 50% { opacity:.45; } }
  .chip.done { border-color:var(--done); color:var(--done); }
  .chip.failed { border-color:var(--failed); color:var(--failed); }
  .chip.stale { opacity:.55; }
  .log { list-style:none; margin:0; padding:8px 0; max-height:300px; overflow-y:auto; overscroll-behavior:contain; font-family:ui-monospace, monospace; font-size:12px; flex:1; scrollbar-width:thin; }
  /* content-visibility: the log is a 300px scroll box showing ~10 of up to
     LOG_CAP rows — skipping layout for the off-screen ones took Layout from
     322ms to 116ms on the 100k-event stream (FRONTEND-RENDER-5). */
  .log li { padding:3px 14px; display:flex; gap:10px; border-left:3px solid transparent; content-visibility:auto; contain-intrinsic-size:auto 22px; }
  /* Trimmed-history disclosure: the per-plan log DOM is capped at LOG_CAP rows
     and what the cap dropped is NAMED on screen, with a one-click route back to
     the whole history (a ?snap=0 reconnect). A cap is never silent. */
  /* "logtrim", not "trimmed": logLi sets li.className from the stream's own
     `state` text, so the two namespaces must stay disjoint — an event whose
     state happened to read "trimmed" would otherwise render as a disclosure
     row. No agent-written state can collide with this prefixed name. */
  .log li.logtrim { color:var(--muted); font-style:italic; content-visibility:visible; }
  .log li.logtrim button { background:none; border:none; padding:0; font:inherit; color:var(--muted); text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
  .log li.logtrim button:hover, .log li.logtrim button:focus-visible { color:var(--info); }
  .log li .t { color:var(--muted); flex:none; }
  .log li .s { flex:none; width:64px; font-weight:600; }
  .log li.running { border-left-color:var(--running); } .log li.running .s { color:var(--running); }
  .log li.done { border-left-color:var(--done); } .log li.done .s { color:var(--done); }
  .log li.failed { border-left-color:var(--failed); } .log li.failed .s { color:var(--failed); }
  .log li.info .s { color:var(--info); }
  .log li .d { overflow-wrap:anywhere; }
  .empty { color:var(--muted); padding:14px; font-size:12px; grid-column:1/-1; }
  /* Artifacts card (task view only): a full-width card inside the cards grid,
     placed after the wide orchestrator card and before the loop cards. The
     card pins at most two rows — the final HTML report and the plan document;
     every other file lives behind the "all files" popup so the working set
     never crowds the task view. */
  #artifacts { display:none; grid-column:1 / -1; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  body.task #artifacts.has { display:block; }
  #artifacts .ahdr { display:flex; align-items:center; gap:4px 10px; flex-wrap:wrap; padding:10px 14px; color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
  .allfiles { margin-left:auto; display:inline-flex; align-items:center; gap:6px; font-family:inherit; font-size:11px; font-weight:600; letter-spacing:.04em; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:99px; padding:3px 11px; cursor:pointer; }
  .allfiles:hover, .allfiles:focus-visible { border-color:var(--info); color:var(--info); }
  .allfiles .n { color:var(--muted); font-weight:500; }
  /* The same pill in a loop card's header ("files" — that loop's output):
     .tok already owns the header's auto margin, so the pill sits after it. */
  .card h2 .allfiles { margin-left:0; flex:none; }
  .card h2 .allfiles[hidden] { display:none; }
  #artifacts .anone { border-top:1px solid var(--line); padding:9px 14px; color:var(--muted); font-size:12px; }
  /* One artifact row, shared by the card (reports) and the popup (everything):
     kind icon, dir-muted/name-bold path, size + age on the right. */
  .arow { display:flex; align-items:baseline; gap:8px; width:100%; padding:7px 14px; background:none; border:none; border-top:1px solid var(--line); color:var(--text); text-align:left; text-decoration:none; cursor:pointer; font-family:inherit; font-size:12px; min-width:0; }
  .arow:hover, .arow:focus-visible { background:var(--panel2); }
  .arow .aicon { flex:none; }
  .arow.rep .aicon, .arow.rep .aname { color:var(--done); }
  .arow.plan .aicon, .arow.plan .aname { color:var(--info); }
  .arow.note .aicon { color:var(--muted); }
  .arow .apath { display:flex; flex:1 1 auto; min-width:0; font-family:ui-monospace, monospace; }
  .arow .adir { color:var(--muted); flex:0 4 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .arow .aname { font-weight:600; flex:0 1 auto; min-width:8ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .arow .ameta { flex:none; color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .arow .go { flex:none; color:var(--muted); font-size:11px; }
  /* All-files popup: plan files -> html reports -> notes, grouped */
  #artOverlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:9; display:none; align-items:center; justify-content:center; padding:24px; }
  #artOverlay.open { display:flex; }
  #artBox { background:var(--panel); border:1px solid var(--line); border-radius:12px; width:min(720px, 100%); max-height:88vh; display:flex; flex-direction:column; overflow:hidden; }
  #artBox .mdhead button { margin-left:auto; }
  #artList { overflow:auto; overscroll-behavior:contain; padding:2px 0 10px; scrollbar-width:thin; }
  #artList .agroup { padding:12px 14px 6px; color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
  /* Markdown preview modal */
  #mdOverlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:10; display:none; align-items:center; justify-content:center; padding:24px; }
  #mdOverlay.open { display:flex; }
  #mdBox { background:var(--panel); border:1px solid var(--line); border-radius:12px; width:min(900px, 100%); max-height:90vh; display:flex; flex-direction:column; overflow:hidden; }
  .mdhead { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  .mdhead .fname { font-weight:600; font-size:13px; font-family:ui-monospace, monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mdhead a { color:var(--info); font-size:12px; margin-left:auto; flex:none; }
  .mdhead button { background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:2px 6px; flex:none; }
  .mdhead button:hover { color:var(--text); }
  #mdBody { padding:16px 20px; overflow:auto; overscroll-behavior:contain; font-size:13px; scrollbar-width:thin; }
  #mdBody h1, #mdBody h2, #mdBody h3, #mdBody h4 { margin:14px 0 6px; line-height:1.3; }
  #mdBody h1 { font-size:17px; } #mdBody h2 { font-size:15px; } #mdBody h3, #mdBody h4 { font-size:13px; }
  #mdBody p, #mdBody ul, #mdBody ol, #mdBody table, #mdBody blockquote { margin:6px 0; }
  #mdBody pre { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow-x:auto; font-size:12px; }
  #mdBody code { font-family:ui-monospace, monospace; background:var(--panel2); padding:1px 4px; border-radius:4px; font-size:12px; }
  #mdBody pre code { background:none; padding:0; }
  #mdBody blockquote { border-left:3px solid var(--line); padding:2px 12px; color:var(--muted); }
  #mdBody table { border-collapse:collapse; display:block; overflow-x:auto; max-width:100%; }
  #mdBody th, #mdBody td { border:1px solid var(--line); padding:4px 10px; text-align:left; }
  #mdBody th { background:var(--panel2); }
  #mdBody a { color:var(--info); }
  #mdBody hr { border:none; border-top:1px solid var(--line); margin:12px 0; }
  /* Session timeplan (task view): the run-dossier timeline bar, computed live
     from the event stream — solid where agents were emitting events, hatched
     where no run was open (between runs), red where an open run went silent. */
  #timeplan { display:none; padding:20px 24px 0; max-width:1600px; margin:0 auto; }
  body.task #timeplan.has, body.stats #timeplan.has { display:block; }
  #timeplan .tpanel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .tphead { display:flex; align-items:baseline; gap:10px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px; }
  .tphead .range { margin-left:auto; font-weight:500; text-transform:none; letter-spacing:0; font-variant-numeric:tabular-nums; }
  .tpbar { display:flex; height:24px; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--panel2); position:relative; }
  .tpbar i { display:block; height:100%; flex:1 0 0; }
  .tpbar .up { background:color-mix(in srgb, var(--done) 40%, var(--panel2)); }
  .tpbar .idle { background:repeating-linear-gradient(135deg, var(--panel2) 0 5px, var(--line) 5px 7px); }
  .tpbar .down { background:var(--failed); }
  .tpbar .idle, .tpbar .down { min-width:3px; }
  .tplab { display:flex; justify-content:space-between; font-family:ui-monospace, monospace; font-size:11px; color:var(--muted); margin-top:5px; }
  .tplegend { display:flex; flex-wrap:wrap; gap:4px 18px; margin-top:8px; font-size:11px; color:var(--muted); }
  .tplegend i { display:inline-block; width:11px; height:11px; border:1px solid var(--line); border-radius:3px; vertical-align:-2px; margin-right:5px; }
  .tplegend .tphint { margin-left:auto; opacity:.75; }
  .tplegend .up { background:color-mix(in srgb, var(--done) 40%, var(--panel2)); }
  .tplegend .idle { background:repeating-linear-gradient(135deg, var(--panel2) 0 4px, var(--line) 4px 6px); }
  .tplegend .down { background:var(--failed); }
  /* Hover time-point: a measuring ruler under the strip (labeled major
     graduations on round wall-clock instants, unlabeled minors), a cursor
     line under the pointer, and a popover previewing the agents mid-run at
     that instant. A session longer than a day widens the track to one
     viewport width per day inside a horizontally slidable scroll viewport.
     overflow-y is hidden and the popover lives OUTSIDE the scroll container
     (in .tpstrip): anything poking below the track would otherwise summon a
     vertical scrollbar and clip the popover. */
  .tpscroll { overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; }
  .tptrack { position:relative; min-width:100%; }
  .tpbar .tpgrid { position:absolute; top:0; bottom:0; width:1px; background:var(--line); opacity:.8; pointer-events:none; }
  .tpbar .tpgrid.day { background:var(--muted); }

  .tpruler i { position:absolute; top:0; width:0; border-left:1px solid var(--line); pointer-events:none; }
  .tpruler i.min { height:4px; }
  .tpruler i.maj { height:7px; border-left-color:var(--muted); }
  .tpruler i.day { height:9px; border-left-color:var(--text); }
  .tpruler b { position:absolute; top:6px; left:0; transform:translateX(-50%); font:500 9px/1.3 ui-monospace, monospace; color:var(--muted); white-space:nowrap; }
  #tpCursor { position:absolute; top:0; bottom:0; width:0; border-left:1px solid var(--info); pointer-events:none; z-index:2; }
  #tpTip { position:absolute; transform:translateX(-50%); z-index:6; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 11px; font-size:11px; line-height:1.5; pointer-events:none; white-space:nowrap; box-shadow:0 8px 24px rgba(0,0,0,.35); max-width:min(440px, 92vw); }
  #tpTip .tth { display:flex; align-items:center; gap:10px; font-family:ui-monospace, monospace; font-weight:600; }
  #tpTip .tth .kind.up { color:var(--done); }
  #tpTip .tth .kind.idle { color:var(--muted); }
  #tpTip .tth .kind.down { color:var(--failed); }
  #tpTip .seg { color:var(--muted); font-family:ui-monospace, monospace; }
  #tpTip ul { list-style:none; margin:6px 0 0; padding:0; }
  #tpTip li { display:flex; align-items:center; gap:7px; font-family:ui-monospace, monospace; }
  #tpTip li .dot { width:7px; height:7px; border-radius:50%; background:var(--queued); flex:none; }
  #tpTip li.running .dot { background:var(--running); }
  #tpTip li.done .dot { background:var(--done); }
  #tpTip li.failed .dot { background:var(--failed); }
  #tpTip li.stale { opacity:.55; }
  #tpTip li .who { max-width:44ch; overflow:hidden; text-overflow:ellipsis; }
  #tpTip li .at { margin-left:auto; color:var(--muted); padding-left:14px; font-variant-numeric:tabular-nums; }
  #tpTip .none { color:var(--muted); margin-top:4px; }
  /* Time dials beside the strip: elapsed chronograph (one revolution/hour),
     silence stopwatch (needle sweeps toward the 4m stall limit; status color
     always paired with a state word), working-share gauge. Values live in
     figcaption text tokens — the arc only ever carries state, never a label. */
  .tpbody { display:flex; gap:14px 26px; align-items:flex-start; flex-wrap:wrap; }
  .tpstrip { flex:1 1 420px; min-width:260px; position:relative; }
  .tpdials { display:flex; gap:16px; flex:none; padding-top:2px; }
  .dial { margin:0; display:flex; flex-direction:column; align-items:center; gap:1px; width:74px; text-align:center; }
  .dial svg { width:58px; height:58px; display:block; }
  .dial .track, .dial .ticks { stroke:var(--line); }
  .dial .hub { fill:var(--muted); }
  .dial .needle { stroke:var(--text); }
  .dial .dv { font:600 12px/1.4 ui-monospace, monospace; font-variant-numeric:tabular-nums; color:var(--text); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dial .dl { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  #dialWork .arc { stroke:color-mix(in srgb, var(--done) 70%, var(--panel2)); }
  #dialSilence .arc { stroke:var(--done); }
  #dialSilence.slow .arc { stroke:var(--running); }
  #dialSilence.stall .arc { stroke:var(--failed); }
  .dial.off svg { opacity:.45; }
  .dial.off .needle { visibility:hidden; }
  /* Wide screens: the full-width orchestrator card splits into two columns —
     flow/agents/stages on the left, the log filling the right — so a short
     log no longer sits alone in a huge empty strip. */
  @media (min-width: 1100px) {
    .card.wide { display:grid; grid-template-columns:minmax(340px, 34%) 1fr;
                 grid-template-rows:auto auto auto auto auto 1fr;
                 grid-template-areas:"h h" "flow log" "agents log" "stage log" "subplans log" ". log"; }
    .card.wide h2 { grid-area:h; }
    .card.wide .flow { grid-area:flow; }
    .card.wide .agents { grid-area:agents; }
    .card.wide .subplans { grid-area:subplans; }
    .card.wide .stagebar { grid-area:stage; }

    .log li .d { max-width:90ch; }

  @media (max-width: 640px) {
    header { padding:10px 12px; gap:8px; }
    main#cards { padding:12px; gap:12px; }
    #timeplan { padding:12px 12px 0; }
    main#home { padding:12px; gap:10px; }
    main#statsView { padding:12px; gap:10px; }
    .stat .sv { font-size:28px; }
    .stat.hero .sv { font-size:40px; }
    #crumb { display:none; }
    #taskSel { max-width:48vw; }
    /* ≥16px stops iOS Safari from auto-zooming on focus; extra padding = tap target */
    #taskSel, #rateSel, #zoomSel { font-size:16px; padding:6px 10px; }

<script>
// Two URL-routed views, the query string is the single source of truth:
//   /              -> home: grid of every task folder, click-through to a task
//   /?task=<name>  -> that task's live progress page (survives refresh/share)
// Dropdown changes and tile clicks pushState; back/forward re-route.
const plans = new Map();

// FOLD_GEN binds this page's fold to monitor_server.py's: the SAME integer
// literal appears verbatim in both files, a source-text test asserts they are
// equal, and every v2 hello/snapshot carries it. Bump it in BOTH files whenever
// a fold rule changes; a snapshot whose foldGen we do not recognise is
// DISCARDED and a full replay (?snap=0) requested, so drift fails safe instead
// of rendering a state built by other rules (DATA-MODEL-9).
const FOLD_GEN = 1;

// capped and every cap is disclosed on screen (LOG_CAP here, TP_TAIL_MAX for

const LOG_CAP = 400;

      overallEl = document.getElementById("overall"),
      connEl = document.getElementById("conn"),
      connTxt = document.getElementById("connText");

// (cardsDirty), the totals line (summaryDirty) and, per plan, the flow strip
// (flowDirty), the header span (spanDirty) and the buffered log lines. They are
// flushed at the end of a v2 batch/control frame, at replay end, and by the 1 s
// interval — one paint per burst instead of one per event.
let cardsDirty = false, summaryDirty = false;
// True while a v2 array frame is being iterated. A live tick carries up to
// MAX_TICK_EVENTS = 5,000 events in ONE frame, so `replaying` alone is not
// enough to keep the totals line off the per-event path: a batch is its own
// burst and gets its own single flush at the frame's end.
let batching = false;

function planEl(id) {
  if (plans.has(id)) return plans.get(id);
  const card = document.createElement("section");
  card.className = "card" + (id === "orchestrator" ? " wide" : "");
  card.innerHTML = `<h2><span class="badge">queued</span><span class="title"></span><span class="span"></span><span class="tok"></span></h2>
    <div class="flow"></div><ul class="agents"></ul><div class="stagebar"></div><ul class="log"></ul>`;
  card.querySelector(".title").textContent = id === "orchestrator" ? "Orchestrator" : id;
  if (id === "orchestrator") {
    // Accordion content: the sub-plans bullet list (filled by renderSubplans)
    // sits above the log; both fold behind the same arrow.
    const sub = document.createElement("ul");
    sub.className = "subplans";
    card.insertBefore(sub, card.querySelector(".log"));
    // Fold arrow in the card header toggles the accordion (header stays).
    // Collapsed by default; choice persists like the other orch* prefs.
    const btn = document.createElement("button");
    btn.className = "foldbtn"; btn.textContent = "▶"; btn.title = "show/hide sub-plans & log";
    const applyFold = (open) => { card.classList.toggle("logfold", !open); btn.setAttribute("aria-expanded", String(open)); };
    applyFold(localStorage.getItem("orchLogOpen") === "1");
    btn.onclick = () => {
      const open = card.classList.contains("logfold");
      localStorage.setItem("orchLogOpen", open ? "1" : "0");
      applyFold(open);
    };
    card.querySelector("h2").prepend(btn);
  }
  const entry = { card, badge: card.querySelector(".badge"), stagebar: card.querySelector(".stagebar"),
                  log: card.querySelector(".log"), tok: card.querySelector(".tok"),
                  titleEl: card.querySelector(".title"), spanEl: card.querySelector(".span"),
                  flowEl: card.querySelector(".flow"), agentsEl: card.querySelector(".agents"),
                  subplansEl: card.querySelector(".subplans"), subplansKey: "", roster: [], filesBtn: null,
                  agents: new Map(), roles: new Map(), firstTs: null, lastTs: null, lastMs: null,
                  tokIn: 0, tokOut: 0, tokCached: 0, tokWrite: 0, stages: new Map(), state: "queued",
                  flowDirty: false, spanDirty: false,
                  logBuf: [], logNote: null, logTotal: 0, logTrimmed: 0 };
  plans.set(id, entry);
  // FRONTEND-RENDER-8: planEl used to render here and onEvent rendered again for
  // the same event. Mark the card SET as changed instead — the caller's render()
  // re-appends once, and only when the set actually moved.
  cardsDirty = true;
  return entry;
}
// FRONTEND-RENDER-1: this ran on every event and re-appendChild'd every card —
// appendChild of an attached node is a DOM move, so 19 plans x 12,334 events was
// ~247,000 subtree moves, 71 % of onEvent's time and the page's main layout
// driver. Both halves are now gated: the card loop runs only when the plan SET
// changed, and the totals are deferred behind summaryDirty while a burst is
// replaying (flushed by flushDirty at the batch/replay boundary and the 1 s
// interval).
function render() {
  if (cardsDirty) {
    cardsDirty = false;
    if (plans.has("orchestrator")) cardsEl.appendChild(plans.get("orchestrator").card);
    for (const id of plans.keys())
      if (id !== "orchestrator") cardsEl.appendChild(plans.get(id).card);
    placeArtifacts();  // artifacts row sits after the orchestrator card, before the loop cards
    updateFileBtns();  // a card created after the last /artifacts response still gets its pill
  }
  if (replaying || batching) { summaryDirty = true; return; }
  renderTotals();
}
function renderTotals() {
  summaryDirty = false;
  let done = 0, failed = 0, running = 0;
  for (const [id, p] of plans) {
    if (id === "orchestrator") continue;
    if (p.state === "done") done++; else if (p.state === "failed") failed++; else if (p.state === "running") running++;
  }
  let tin = 0, tout = 0, tcached = 0, twrite = 0;
  for (const p of plans.values()) { tin += p.tokIn; tout += p.tokOut; tcached += p.tokCached; twrite += p.tokWrite; }
  if (plans.has("orchestrator") && tin + tout)
    setTok(plans.get("orchestrator").tok, `Σ ${fmtIn(tin, tcached, twrite)} · out ${fmtTok(tout)}`);
  overallEl.textContent =
    `${done} done · ${running} running · ${failed} failed · ${plans.size - (plans.has("orchestrator")?1:0)} plans` +
    (tin + tout ? ` · ${fmtIn(tin, tcached, twrite)} · out ${fmtTok(tout)}` : "");
  renderSubplans();
}
// Orchestrator accordion: one bullet per sub-plan loop (state dot + name +
// state word), rebuilt only when the id/state set actually changed — this sits
// on the renderTotals cadence (flush boundaries + the 1 s interval), never the
// per-event path. Clicking a bullet jumps to that loop's card.
function renderSubplans() {
  const orch = plans.get("orchestrator");
  if (!orch || !orch.subplansEl) return;
  let key = "";
  for (const [id, p] of plans) if (id !== "orchestrator") key += id + ":" + p.state + ";";
  key += "|" + (orch.roster || []).join("¦");
  if (key === orch.subplansKey) return;
  orch.subplansKey = key;
  orch.subplansEl.textContent = "";
  for (const [id, p] of plans) {
    if (id === "orchestrator") continue;
    const li = document.createElement("li");
    li.className = p.state;
    li.tabIndex = 0;
    li.title = "jump to this loop's card";
    const dot = document.createElement("span");
    dot.className = "dot";
    const name = document.createElement("span");
    name.className = "spname";
    name.textContent = id;
    const st = document.createElement("span");
    st.className = "spstate";
    st.textContent = p.state;
    li.append(dot, name, st);
    li.onclick = () => p.card.scrollIntoView({ behavior: "smooth", block: "start" });
    li.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); li.onclick(); } };
    orch.subplansEl.appendChild(li);
  }
  // Roster entries whose loop has NO card yet: neutral "planned" bullets —
  // display only, deliberately not queued as cards and not clickable. Entry
  // format "<id> — <title>"; the id is shown, the full entry is the tooltip.
  for (const entry of orch.roster || []) {
    const id = entry.split(" — ")[0].trim();
    if (!id || plans.has(id)) continue;
    const li = document.createElement("li");
    li.className = "planned";
    li.title = entry;
    const dot = document.createElement("span");
    dot.className = "dot";
    const name = document.createElement("span");
    name.className = "spname";
    name.textContent = id;
    const st = document.createElement("span");
    st.className = "spstate";
    st.textContent = "planned";
    li.append(dot, name, st);
    orch.subplansEl.appendChild(li);
  }
}
function fmtTok(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
}
// Input-side display: "in 3k - r:1k w:2k" (r = cache read, w = cache write).
// An agent loop re-reads its whole conversation prefix every turn, so cache
// reads dominate "in" (and cost ~10x less than fresh input). The r:/w: parts
// appear only when the event stream carries the breakdown; events from
// pre-split watchers lack them and keep the plain "in 3k" form.
function fmtIn(tin, cached, write) {
  const parts = [];
  if (cached > 0) parts.push(`r:${fmtTok(cached)}`);
  if (write > 0) parts.push(`w:${fmtTok(write)}`);
  return `in ${fmtTok(tin)}` + (parts.length ? " - " + parts.join(" ") : "");
}
// The coalescer (GD-E): one pass over the dirty flags, called at the end of a
// v2 batch or control frame, at replay end, and once a second. Everything a
// per-event path used to do synchronously — the flow strip, the header span,
// the log rows, the timeplan fold, the totals — lands here exactly once per
// burst instead of once per event.
function flushDirty() {
  for (const p of plans.values()) {
    if (p.flowDirty) { p.flowDirty = false; renderFlow(p); }
    if (p.spanDirty) { p.spanDirty = false; updateSpan(p); }
    if (p.logBuf.length) flushLog(p);
  }
  if (cardsDirty || summaryDirty) render();
}
// The timeplan strip is deliberately NOT in that pass. tpRender writes
// tpTrack.style.width and then READS tpTrack/tpScroll clientWidth to re-fit the
// view — a FORCED SYNCHRONOUS LAYOUT, the exact shape this pass exists to keep
// off per-frame paths. flushDirty runs at the end of every array frame, and one
// live tick at MAX_TICK_EVENTS is split by the server's batch caps into up to
// ten of them, so rebuilding the strip there would mean ten forced layouts
// inside one 0.5 s tick (~2x/s in ordinary live operation against the
// baseline's 1x/s). The strip keeps its own cadence instead: the standing 1 s
// interval, one paint at replay end, and the direct user gestures (wheel zoom,
// dblclick, hover) which are not stream-driven.
function tpFlush() { if (tpDirty || tpLive) tpRender(); }
let replaying = false, replayTimer = null, replaySettle = null;
// Reduced motion is a JS decision here: the CSS media query at the top of the
// file can only silence CSS animations, and the pulse below is WAAPI.
const REDUCED_MOTION = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
// FRONTEND-RENDER-2 (blocker): the pulse used to be remove-the-class, read
// offsetWidth purely for its side effect, add-the-class again — a
// FORCED SYNCHRONOUS LAYOUT, skipped only while `replaying`. When the 600 ms
// replay heuristic lapsed mid-history it fired on all 34,778 counter writes and
// the page spent 137 s in layout and never settled. WAAPI restarts an animation
// natively and reads no layout, so the forced-reflow pattern is gone file-wide.
const TOK_PULSE = [{ color: "var(--running)", transform: "scale(1.12)" },
                   { color: "var(--muted)", transform: "scale(1)" }];
function pulseTok(el) {
  if (!el.animate || (REDUCED_MOTION && REDUCED_MOTION.matches)) return;
  try { el.animate(TOK_PULSE, { duration: 500, easing: "ease-out" }); } catch (e) {}
}
// Replay-end detection, in order of authority:
//   v2  — the {"m":"tail"} boundary frame IS the boundary; the hello cancels
//         both v1 heuristics and no timer is ever armed again (WS-PROTOCOL-2).
//   v1  — self-tuning: a 0 ms timer re-armed after every message fires only
//         once the socket's task queue has drained, so the burst ends when it
//         actually ends instead of 600 ms later. The 600 ms timer survives ONLY
//         as a last-resort backstop.
// The drain timer is NOT armed before the first frame: at `ws.onopen` there is
// nothing to drain, and a 0 ms task would beat the socket's first message to

// ---- home grid ----
function ago(mtime) {
  if (!mtime) return "no events yet";
  const s = Math.max(0, Date.now() / 1000 - mtime);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
function renderHome() {
  if (currentTask !== null || !tasksData) return;
  const home = document.getElementById("home");
  home.innerHTML = "";
  if (!tasksData.tasks.length) {
    home.innerHTML = `<div class="empty">no task folders found — start an orchestrator run and it will appear here</div>`;
    return;
  }
  for (const t of tasksData.tasks) {
    const tile = document.createElement("section");
    tile.className = "tile";
    tile.tabIndex = 0;
    tile.setAttribute("role", "link");
    tile.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); navigate(t.name); } };
    tile.innerHTML = `<h3><span class="name"></span><span class="badge"></span><span class="tok"></span></h3>
      <div class="lastline"></div><div class="meta"></div>`;
    tile.querySelector(".name").textContent = t.name;
    const tok = t.tokens || { in: 0, out: 0 };
    if (tok.in + tok.out)
      tile.querySelector(".tok").textContent = `Σ ${fmtIn(tok.in, tok.cached || 0, tok.cache_write || 0)} · out ${fmtTok(tok.out)}`;
    // overall run status from the server; old server processes predate the
    // "status" field — fall back to the last event's state, then "empty"
    const st = t.status || (t.last && t.last.state) || "empty";
    const badge = tile.querySelector(".badge");
    badge.textContent = st;
    badge.className = "badge" + (st !== "empty" ? " " + st : "");
    tile.querySelector(".lastline").textContent = t.last
      ? (t.last.stage ? "[" + t.last.stage + "] " : "") + (t.last.detail || "")
      : "no events yet";
    tile.querySelector(".meta").textContent = "last activity " + ago(t.mtime);
    tile.onclick = () => navigate(t.name);
    home.appendChild(tile);
  }
}

// ---- task list (feeds both the dropdown and the home grid) ----
async function refreshTasks() {
  try {
    tasksData = await (await fetch("/tasks")).json();
    const sel = document.getElementById("taskSel");
    const names = tasksData.tasks.map(t => t.name).join("\n");
    if (sel.dataset.names !== names) {
      sel.dataset.names = names;
      sel.innerHTML = "";
      for (const t of tasksData.tasks) {
        const o = document.createElement("option");
        o.value = t.name; o.textContent = t.name + (t.events ? "" : " (no events)");
        sel.appendChild(o);

    if (currentTask) selectTask(currentTask);

  } catch (e) {}
}

  if (ws) { ws.onclose = null; ws.onmessage = null; ws.onopen = null; ws.onerror = null; ws.close(); }
  retry = 1000;
  // WS-PROTOCOL-3: a forced resync is a CURSOR resume, not a re-replay. Every
  // non-"live" option used to close the socket and re-ship the whole stream —
  // at 500 ms, against a rebuild that measured ~6.2 s, the page never finished
  // one. With the server's published cursor it costs one empty tick, so the
  // persisted setting stops being a foot-gun and the UI needs no change.
  // Belt-and-braces beside connect()'s own `if (!resumeFrom) wsCursor = null`:
  // while a burst is still in flight the on-screen state is not yet the state
  // the cursor describes, so resync as a clean REBUILD rather than a resume.
  connect(replaying ? null : wsCursor);
}
function applyRate(ms) {
  clearInterval(resyncTimer); resyncTimer = null;
  if (ms > 0) resyncTimer = setInterval(forceResync, ms);
}
rateSel.value = localStorage.getItem("orchRefreshRate") || "0";
if (rateSel.selectedIndex < 0) rateSel.value = "0";
rateSel.onchange = () => { localStorage.setItem("orchRefreshRate", rateSel.value); applyRate(+rateSel.value); };
applyRate(+rateSel.value);
// Task-view zoom: writes the --zoom custom property consumed by the
// body.task/body.stats CSS rule above — the value is one of the fixed
// option literals, never free text. Choice persists in localStorage.
const zoomSel = document.getElementById("zoomSel");
function applyZoom(z) { document.documentElement.style.setProperty("--zoom", z); }
zoomSel.value = localStorage.getItem("orchZoom") || "1";
if (zoomSel.selectedIndex < 0) zoomSel.value = "1";  // stored value no longer an option -> default
zoomSel.onchange = () => { localStorage.setItem("orchZoom", zoomSel.value); applyZoom(zoomSel.value); };
applyZoom(zoomSel.value);
refreshTasks();
route();
setInterval(() => { refreshTasks(); refreshArtifacts(); }, 5000);
</script>
</body>
</html>
